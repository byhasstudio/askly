name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "worker/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan kunci tanda tangan tetap
        run: |
          base64 -d keystore.b64 > app/askly.keystore
          keytool -list -keystore app/askly.keystore -storepass askly123 -alias askly

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: askly-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Pindahkan tag latest
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publikasikan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Askly build ${{ github.run_number }}
          body: "APK debug terbaru (build ${{ github.run_number }}). Unduh app-debug.apk lalu install."
          files: app/build/outputs/apk/debug/app-debug.apk
